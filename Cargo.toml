[package]
name = "s3player"
version = "0.0.1"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only used when build.rs sets cfg(embed_frontend): `debug-embed` so a forced
# embed in a non-release build is really compiled in, `interpolate-folder-path`
# to read the bundle from Cargo's OUT_DIR.
rust-embed = { version = "8.11.0", features = ["debug-embed", "interpolate-folder-path"] }
new_mime_guess = "4"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
urlencoding = "2.1"
rand = "0.9"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"

[build-dependencies]
anyhow = "1"

[dev-dependencies]
aws-sdk-s3 = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
aws-smithy-mocks = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
