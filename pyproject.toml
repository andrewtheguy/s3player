[project]
name = "s3player"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0,<0.32.0",
    "boto3>=1.43.0,<1.44.0",
    "fastapi>=0.136.1,<0.137.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.46.0,<0.47.0",
]

[project.scripts]
s3player = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.2",
    "basedpyright>=1.39.3,<1.40.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12,<0.16.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "frontend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.basedpyright]
include = ["app"]
exclude = [".venv", "frontend", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
